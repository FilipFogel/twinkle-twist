# Bygger en debug-APK med AdMob (testannonser) varje gång du pushar till main,
# eller när du trycker "Run workflow" under fliken Actions.
# APK:n hamnar under körningens "Artifacts".
name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg debug-APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ljusslinga-debug-apk
          path: app/build/outputs/apk/debug/*.apk
