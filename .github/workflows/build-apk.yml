# Builds a debug APK with AdMob (test ads) every time you push to main,
# or when you press "Run workflow" under the Actions tab.
# The APK ends up under the run's "Artifacts".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: twinkle-twist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
